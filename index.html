<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Login Overlay (Falls nicht eingeloggt) -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-2 text-center">🔒 Login erforderlich</h2>
            <p class="text-xs text-slate-400 mb-6 text-center">Bitte melde dich an, um deine Habits aus der Cloud zu laden.</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-Mail</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Passwort</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition mt-2">Anmelden</button>
                <div id="login-error" class="text-rose-400 text-xs text-center mt-2 hidden"></div>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span>🎯</span> Habit Tracker <span id="sync-status" class="text-[10px] text-amber-400 font-normal ml-2">Lade...</span>
        </h1>
        <div class="flex items-center gap-2">
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl font-medium text-sm transition">
                <i class="fa-solid fa-plus mr-1"></i> Neu
            </button>
            <button onclick="handleLogout()" title="Abmelden" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1.5 rounded-xl text-sm transition">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        <!-- Filter Tabs -->
        <div class="flex bg-slate-800 p-1 rounded-xl mb-6 border border-slate-700">
            <button onclick="setFilter('all')" id="filter-all" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">Alle</button>
            <button onclick="setFilter('goal')" id="filter-goal" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 transition">Vorsätze</button>
            <button onclick="setFilter('restriction')" id="filter-restriction" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 transition">Verbote</button>
        </div>

        <!-- Habits List -->
        <div id="habits-list" class="space-y-4">
            <div class="text-center text-slate-500 py-10 text-sm">Lade Habits aus Supabase...</div>
        </div>
    </main>

    <!-- Detail / Stats Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 id="detail-title" class="text-lg font-bold flex items-center gap-2"></h2>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-4 pr-1">
                <div class="bg-slate-900 border border-slate-750 p-4 rounded-xl grid grid-cols-2 gap-4 text-center">
                    <div>
                        <div class="text-xs text-slate-400">Aktueller Streak</div>
                        <div id="detail-current-streak" class="text-xl font-bold text-emerald-400 mt-1">0 Tage</div>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400">Rekord-Streak</div>
                        <div id="detail-best-streak" class="text-xl font-bold text-indigo-400 mt-1">0 Tage</div>
                    </div>
                </div>
                <div>
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Vergangene Streaks (Historie)</h3>
                    <div id="detail-history-list" class="space-y-2"></div>
                </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-700 flex justify-between">
                <button onclick="deleteCurrentDetailHabit()" class="text-rose-400 hover:text-rose-300 text-sm font-medium transition"><i class="fa-solid fa-trash mr-1"></i> Löschen</button>
                <button onclick="closeDetailModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Add Habit Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <h2 class="text-lg font-bold mb-4">Neues Habit hinzufügen</h2>
            <form id="habit-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Titel</label>
                    <input type="text" id="habit-title" required placeholder="z.B. Joggen oder Kein Zucker" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Typ</label>
                        <select id="habit-type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                            <option value="goal">Vorsatz</option>
                            <option value="restriction">Verbot</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Emoji</label>
                        <input type="text" id="habit-emoji" placeholder="🎯 / 🚫" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Wochentage</label>
                    <div class="grid grid-cols-7 gap-1 text-center" id="weekday-selector">
                        <label class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs cursor-pointer select-none"><input type="checkbox" value="1" checked class="hidden peer"><span>Mo</span></label>
                        <label class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs cursor-pointer select-none"><input type="checkbox" value="2" checked class="hidden peer"><span>Di</span></label>
                        <label class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs cursor-pointer select-none"><input type="checkbox" value="3" checked class="hidden peer"><span>Mi</span></label>
                        <label class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs cursor-pointer select-none"><input type="checkbox" value="4" checked class="hidden peer"><span>Do</span></label>
                        <label class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs cursor-pointer select-none"><input type="checkbox" value="5" checked class="hidden peer"><span>Fr</span></label>
                        <label class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs cursor-pointer select-none"><input type="checkbox" value="6" checked class="hidden peer"><span>Sa</span></label>
                        <label class="bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs cursor-pointer select-none"><input type="checkbox" value="0" checked class="hidden peer"><span>So</span></label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Startdatum (für vergangenen Streak)</label>
                    <input type="date" id="habit-start-date" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl text-sm font-medium transition">Abbrechen</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl text-sm font-medium transition">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase CDN & App Logik -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hyydvqkfklkecgolohkg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_frk0kxw_rqBVqX_qiBRaGw_kBnoZlMl';

        let supabaseClient = null;
        try {
            if (SUPABASE_URL.startsWith('http')) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Supabase nicht konfiguriert.");
        }

        let habits = [];
        let currentFilter = 'all';
        let activeDetailId = null;

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errEl.innerText = "Login fehlgeschlagen: " + error.message;
                errEl.classList.remove('hidden');
            } else {
                document.getElementById('login-overlay').classList.add('hidden');
                initApp();
            }
        };

        window.handleLogout = async function() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
                location.reload();
            }
        };

        window.setFilter = function(filter) {
            currentFilter = filter;
            ['all', 'goal', 'restriction'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
                } else {
                    btn.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 transition";
                }
            });
            render();
        };

        window.openAddModal = function() {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('habit-start-date').value = todayStr;
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        };

        window.closeAddModal = function() {
            document.getElementById('add-modal').classList.remove('flex');
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('habit-form').reset();
        };

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const title = document.getElementById('habit-title').value;
            const type = document.getElementById('habit-type').value;
            let emoji = document.getElementById('habit-emoji').value.trim();
            if (!emoji) emoji = type === 'goal' ? '🎯' : '🚫';
            
            const frequencyDays = Array.from(document.querySelectorAll('#weekday-selector input:checked')).map(el => parseInt(el.value));
            const startDateInput = document.getElementById('habit-start-date').value;
            let completedDates = [];

            if (startDateInput) {
                let current = new Date(startDateInput);
                current.setHours(0,0,0,0);
                let today = new Date();
                today.setHours(0,0,0,0);

                while (current <= today) {
                    const dayOfWeek = current.getDay();
                    if (frequencyDays.includes(dayOfWeek)) {
                        completedDates.push(new Date(current).toISOString());
                    }
                    current.setDate(current.getDate() + 1);
                }
            }

            const newHabit = { id: Date.now().toString(), title, type, emoji, frequencyDays, completedDates };
            habits.push(newHabit);
            
            await saveHabitToCloud(newHabit);
            closeAddModal();
            render();
        };

        async function saveHabitToCloud(habit) {
            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('habits')
                        .upsert({ id: habit.id, data: habit });
                    if (error) throw error;
                    document.getElementById('sync-status').innerText = "☁️ Gesichert";
                } catch (err) {
                    console.error("Supabase-Fehler:", err);
                    document.getElementById('sync-status').innerText = "⚠ Fehler";
                }
            }
        }

        window.toggleToday = async function(id, event) {
            if (event) event.stopPropagation();
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            const today = new Date().setHours(0,0,0,0);
            const index = habit.completedDates.findIndex(d => new Date(d).setHours(0,0,0,0) === today);

            if (index > -1) {
                habit.completedDates.splice(index, 1);
            } else {
                habit.completedDates.push(new Date().toISOString());
            }

            await saveHabitToCloud(habit);
            render();
            if (activeDetailId === id) openDetailModal(id);
        };

        window.deleteCurrentDetailHabit = async function() {
            if (!activeDetailId) return;
            habits = habits.filter(h => h.id !== activeDetailId);
            
            if (supabaseClient) {
                try {
                    await supabaseClient.from('habits').delete().eq('id', activeDetailId);
                } catch (err) {
                    console.error("Löschfehler:", err);
                }
            }

            closeDetailModal();
            render();
        };

        window.openDetailModal = function(id) {
            activeDetailId = id;
            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            document.getElementById('detail-title').innerHTML = `<span>${habit.emoji}</span> ${habit.title}`;
            
            const active = getActiveStreak(habit.completedDates);
            const all = getAllStreaks(habit.completedDates);
            const currentLen = active ? active.length : 0;
            const bestLen = all.length > 0 ? Math.max(...all.map(s => s.length)) : 0;

            document.getElementById('detail-current-streak').innerText = `${currentLen} ${currentLen === 1 ? 'Tag' : 'Tage'}`;
            document.getElementById('detail-best-streak').innerText = `${bestLen} ${bestLen === 1 ? 'Tag' : 'Tage'}`;

            const historyList = document.getElementById('detail-history-list');
            historyList.innerHTML = '';
            
            const history = getPastStreaksHistory(habit.completedDates);
            if (history.length === 0) {
                historyList.innerHTML = `<div class="text-xs text-slate-500 italic py-2">Noch keine vergangenen Streaks aufgezeichnet.</div>`;
            } else {
                history.forEach(s => {
                    const item = document.createElement('div');
                    item.className = "bg-slate-900 border border-slate-750 p-2.5 rounded-xl text-xs flex justify-between items-center";
                    let dateStr = s.startDate === s.endDate ? formatDateDE(s.startDate) : `${formatDateDE(s.startDate)} – ${formatDateDE(s.endDate)}`;
                    item.innerHTML = `<span>${dateStr}</span><strong class="text-indigo-400">${s.length} ${s.length === 1 ? 'Tag' : 'Tage'}</strong>`;
                    historyList.appendChild(item);
                });
            }

            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');
        };

        window.closeDetailModal = function() {
            activeDetailId = null;
            document.getElementById('detail-modal').classList.remove('flex');
            document.getElementById('detail-modal').classList.add('hidden');
        };

        function getAllStreaks(completedDates) {
            if (!completedDates || completedDates.length === 0) return [];
            const normalize = dateStr => new Date(dateStr).setHours(0,0,0,0);
            const sortedUniqueDates = [...new Set(completedDates.map(normalize))].sort((a, b) => a - b);

            let streaks = [];
            let streakStart = sortedUniqueDates[0];
            let previousDate = sortedUniqueDates[0];
            let count = 1;

            for (let i = 1; i < sortedUniqueDates.length; i++) {
                let currentDate = sortedUniqueDates[i];
                let dayAfterPrevious = previousDate + (24 * 60 * 60 * 1000);

                if (currentDate === dayAfterPrevious) {
                    count += 1;
                } else {
                    streaks.push({ length: count, startDate: streakStart, endDate: previousDate });
                    streakStart = currentDate;
                    count = 1;
                }
                previousDate = currentDate;
            }
            streaks.push({ length: count, startDate: streakStart, endDate: previousDate });
            return streaks;
        }

        function getActiveStreak(completedDates) {
            const streaks = getAllStreaks(completedDates);
            if (streaks.length === 0) return null;
            const lastStreak = streaks[streaks.length - 1];
            
            const today = new Date().setHours(0,0,0,0);
            const yesterday = today - (24 * 60 * 60 * 1000);

            if (lastStreak.endDate === today || lastStreak.endDate === yesterday) {
                return lastStreak;
            }
            return null;
        }

        function getPastStreaksHistory(completedDates) {
            const streaks = getAllStreaks(completedDates);
            if (streaks.length === 0) return [];
            
            const today = new Date().setHours(0,0,0,0);
            const yesterday = today - (24 * 60 * 60 * 1000);
            let history = [...streaks];
            
            const last = history[history.length - 1];
            if (last && (last.endDate === today || last.endDate === yesterday)) {
                history.pop();
            }
            return history.reverse();
        }

        function formatDateDE(dateVal) {
            const d = new Date(dateVal);
            return d.toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function isDueToday(frequencyDays) {
            if (!frequencyDays || frequencyDays.length === 0) return true;
            const todayDay = new Date().getDay();
            return frequencyDays.includes(todayDay);
        }

        function isCompletedToday(completedDates) {
            const today = new Date().setHours(0,0,0,0);
            return completedDates.some(d => new Date(d).setHours(0,0,0,0) === today);
        }

        function render() {
            const listEl = document.getElementById('habits-list');
            listEl.innerHTML = '';

            let filtered = habits.filter(h => {
                if (currentFilter === 'all') return true;
                return h.type === currentFilter;
            });

            // Sortierung: 1. Fällig heute, 2. Noch nicht erledigt, 3. Vorsätze ('goal') vor Verboten ('restriction')
            filtered.sort((a, b) => {
                const aDue = isDueToday(a.frequencyDays);
                const bDue = isDueToday(b.frequencyDays);
                const aCompleted = isCompletedToday(a.completedDates);
                const bCompleted = isCompletedToday(b.completedDates);

                if (aDue !== bDue) return aDue ? -1 : 1;
                if (aCompleted !== bCompleted) return aCompleted ? 1 : -1;

                if (!aCompleted && !bCompleted) {
                    if (a.type === 'goal' && b.type !== 'goal') return -1;
                    if (a.type !== 'goal' && b.type === 'goal') return 1;
                }

                return 0;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm">Keine Einträge gefunden.</div>`;
                return;
            }

            filtered.forEach(habit => {
                const dueToday = isDueToday(habit.frequencyDays);
                const completed = isCompletedToday(habit.completedDates);
                const active = getActiveStreak(habit.completedDates);
                const all = getAllStreaks(habit.completedDates);
                const currentStreak = active ? active.length : 0;
                const bestStreak = all.length > 0 ? Math.max(...all.map(s => s.length)) : 0;

                const card = document.createElement('div');
                card.className = `bg-slate-800 border ${completed ? 'border-emerald-500/50 bg-slate-800/80 opacity-75' : dueToday ? 'border-slate-700' : 'border-slate-800 opacity-60'} rounded-2xl p-4 flex items-center justify-between transition-all duration-300 shadow-lg cursor-pointer hover:border-slate-500`;
                card.onclick = () => openDetailModal(habit.id);
                
                card.innerHTML = `
                    <div class="flex items-center gap-3 pointer-events-none pr-2 overflow-hidden">
                        <div class="w-12 h-12 shrink-0 rounded-xl bg-slate-900 flex items-center justify-center text-2xl border border-slate-750">
                            ${habit.emoji}
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <h3 class="font-semibold text-white truncate ${completed ? 'line-through text-slate-400' : ''}">${habit.title}</h3>
                                <span class="shrink-0 text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full font-bold ${habit.type === 'goal' ? 'bg-blue-500/20 text-blue-400' : 'bg-rose-500/20 text-rose-400'}">
                                    ${habit.type === 'goal' ? 'Vorsatz' : 'Verbot'}
                                </span>
                            </div>
                            <div class="text-xs text-slate-400 mt-1 flex items-center gap-3 whitespace-nowrap">
                                <span>🔥 Streak: <strong class="text-white">${currentStreak}</strong></span>
                                <span>🏆 Rekord: <strong class="text-white">${bestStreak}</strong></span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center shrink-0 pl-2">
                        ${dueToday ? `
                        <button type="button" onclick="toggleToday('${habit.id}', event)" class="w-10 h-10 rounded-xl flex items-center justify-center transition ${completed ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/35' : 'bg-slate-900 border border-slate-700 text-slate-500 hover:text-white'}">
                            <i class="fa-solid fa-check text-sm pointer-events-none"></i>
                        </button>` : `<span class="text-xs font-medium text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg">Ruhetag</span>`}
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        document.querySelectorAll('#weekday-selector input').forEach(input => {
            input.addEventListener('change', (e) => {
                const label = e.target.parentElement;
                if (e.target.checked) {
                    label.className = "bg-indigo-600 border-indigo-500 text-white rounded-lg p-1.5 text-xs cursor-pointer select-none font-semibold transition";
                } else {
                    label.className = "bg-slate-900 border border-slate-700 text-slate-400 rounded-lg p-1.5 text-xs cursor-pointer select-none transition";
                }
            });
            const label = input.parentElement;
            if (input.checked) {
                label.className = "bg-indigo-600 border-indigo-500 text-white rounded-lg p-1.5 text-xs cursor-pointer select-none font-semibold transition";
            }
        });

        async function initApp() {
            if (!supabaseClient) {
                document.getElementById('sync-status').innerText = "⚠️ Kein Supabase";
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('sync-status').innerText = "🔒 Bitte Login";
                return;
            }

            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('sync-status').innerText = "☁️️ Gesichert";

            try {
                const { data, error } = await supabaseClient.from('habits').select('data');
                if (error) throw error;
                habits = data ? data.map(row => row.data) : [];
            } catch (err) {
                console.error("Ladefehler:", err);
                document.getElementById('sync-status').innerText = "⚠️ Sync-Fehler";
            }
            render();
        }

        initApp();
    </script>
</body>
</html>
